[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-audit"
version = "1.0.0"
description = "Audit a Paradox mod against vanilla patch changes"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "pdx-utilities @ git+https://github.com/mikejaklitsch/pdx-utilities.git"]

[project.scripts]
pdx-audit = "pdxaudit.cli:main"

[tool.setuptools.packages.find]
include = ["pdxaudit*"]

[tool.setuptools.package-data]
pdxaudit = ["fonts/*", "assets/*", "syntax/*"]
