[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-audit"
version = "1.0.0"
description = "Audit a Paradox mod against vanilla patch changes"
requires-python = ">=3.10"

[project.scripts]
pdx-audit = "pdxaudit.cli:main"

[tool.setuptools.packages.find]
include = ["pdxaudit*", "pdx_utilities*"]
